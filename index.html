<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS26 Tournament Hub</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>DLS26 Tournament Hub</h1>
    <p>Select a tournament or view player records.</p>
</header>

<main>

    <div class="button-container">

        <button class="active"
            onclick="loadBracket('https://brackethq.com/b/knmkd/embed/?name=1');setActive(this)">
            DLS Cup 1
        </button>

        <button
            onclick="loadBracket('https://brackethq.com/b/rchkd/embed/?name=1');setActive(this)">
            DLS Cup 2
        </button>

        <button
            onclick="loadBracket('https://brackethq.com/b/l9tkd/embed/?name=1');setActive(this)">
            DLS Cup 3
        </button>

        <button onclick="showStats();setActive(this)">
            📊 Player Stats
        </button>

        <button onclick="showPowerRankings();setActive(this)">
            ⭐ Power Rankings
        </button>

        <button onclick="showTrophyRoom();setActive(this)">
            🏆 Trophy Room
        </button>

    </div>

    <section id="bracketSection">

        <div class="bracket">

            <iframe
                id="bracketFrame"
                src="https://brackethq.com/b/knmkd/embed/"
                loading="lazy"
                allowfullscreen>
            </iframe>

        </div>

    </section>

    <section id="contentSection" style="display:none;">

        <div class="content-card" id="dynamicContent">

        </div>

    </section>

</main>

<footer>

    <p>Powered by Bracket HQ and my will</p>

</footer>

<script src="script.js"></script>

</body>
</html>
